  const portrait=document.createElement('canvas');portrait.width=1024;portrait.height=1002;
  const pc=portrait.getContext('2d');let portraitFrame=-1;
  const portraitLevels=Uint8Array.from(portraitData.levels||'',ch=>parseInt(ch,16));
  function drawPortrait(t){
    const tick=Math.floor(t*10);if(tick===portraitFrame)return;portraitFrame=tick;
    pc.clearRect(0,0,1024,1002);pc.textBaseline='top';pc.font='5.3333333px "Courier New",monospace';pc.fillStyle='#184D97';
    const glyphSets=['  . ,',':;irsx','x25ShHG','M8W#B0@'];
    const opacities=[.065,.29,.61,.97];
    for(let row=0;row<portraitData.height;row++){
      const lines=['','','',''];
      for(let col=0;col<portraitData.width;col++){
        const level=portraitLevels[row*portraitData.width+col];
        const tone=level===0?-1:level<3?0:level<7?1:level<12?2:3;
        const glyph=tone<0?' ':glyphSets[tone][(col-tick+row*7+glyphSets[tone].length*10000)%glyphSets[tone].length];
        for(let n=0;n<4;n++)lines[n]+=tone===n?glyph:' ';
      }
      for(let n=0;n<4;n++)if(lines[n].trim()){pc.globalAlpha=opacities[n];pc.fillText(lines[n],0,row*6.144)}
    }
    pc.globalAlpha=1;
  }
  function drawAboutCopy(progress){
    const opacity=smooth((progress-.79)/.055);about.style.opacity=String(opacity);about.setAttribute('aria-hidden',opacity>.05?'false':'true');
    const elapsed=reduced.matches?99:aboutTime;
    aboutLetters.forEach((letters,i)=>revealLetters(letters,elapsed-aboutDelays[i],.04));
    locationIcon.style.opacity=elapsed>aboutDelays[4]?'1':'0';
  }
  let debris=null,frozenOcean=null;
  function buildDebris(){
    drawOcean(reduced.matches?0:time,0);
    frozenOcean=document.createElement('canvas');frozenOcean.width=1000;frozenOcean.height=625;frozenOcean.getContext('2d').drawImage(ocean,0,0);
    const pixels=oc.getImageData(0,0,1000,625).data;debris=[];
    const glyphs='.,:;~i1tfxC08MX@';
    for(let y=2;y<625;y+=6)for(let x=2;x<1000;x+=5){
      const at=(y*1000+x)*4,r=pixels[at],g=pixels[at+1],b=pixels[at+2];
      const blue=b>r*1.18&&g>r*1.08&&r<210;
      const gold=r>215&&g>170&&g<230&&b<175;
      const cloud=y<276&&r<200&&Math.max(r,g,b)-Math.min(r,g,b)<32;
      const foam=y>276&&r>245&&g>245&&b>245&&(x+y)%3===0;
      if(!blue&&!gold&&!cloud&&!foam)continue;
      const seed=(Math.sin(x*12.9898+y*78.233)*43758.5453)%1;
      const seed2=Math.abs(Math.sin(x*5.7+y*13.1));
      const angle=Math.atan2(y-310,x-500)+seed*.85;
      debris.push({x,y,glyph:glyphs[(x+y*7)%glyphs.length],color:gold?'#F6D081':cloud?'#9ca7af':foam?'#ffffff':seed2>.4?'#1888BF':'#34B8C5',vx:Math.cos(angle)*(260+seed2*900),vy:Math.sin(angle)*(200+seed2*650),delay:seed2*.10});
    }
  }
  function drawScatter(progress){
    if(!debris)buildDebris();
    const w=canvas.width,h=canvas.height;ctx.globalAlpha=1;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);
    const u=reduced.matches?progress:smooth(progress);
    const under=1-smooth(u/.20);
    if(under>.001){ctx.globalAlpha=under;ctx.drawImage(frozenOcean,-w*.015,-h*.015,w*1.03,h*1.03)}
    ctx.save();ctx.scale(w/1000,h/625);ctx.font='7px "Courier New",monospace';ctx.textBaseline='top';
    const appear=smooth(u/.12);
    for(const d of debris){
      const k=clamp((u-d.delay)/(1-d.delay)),travel=Math.pow(k,1.25);
      ctx.globalAlpha=appear*(1-smooth((k-.12)/.88));if(ctx.globalAlpha<.005)continue;
      ctx.fillStyle=d.color;
      ctx.fillText(d.glyph,d.x+d.vx*travel,d.y+d.vy*travel+100*travel*travel);
    }
    ctx.restore();ctx.globalAlpha=1;
  }
  function drawAbout(){
    const w=canvas.width,h=canvas.height;ctx.globalAlpha=1;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);
    drawPortrait(reduced.matches?0:time);
    const width=w*.445,height=width*(1002/1024);
    ctx.globalAlpha=smooth((state.p-.80)/.055);ctx.drawImage(portrait,w*.525,(h-height)/2,width,height);ctx.globalAlpha=1;
  }
  function updateProgress(progress,fi){
    if(!progressDirty)return;
    slider.value=String(Math.round(progress*1000));output.value=`${Math.round(progress*100)}%`;
    root.dataset.progress=progress.toFixed(3);root.dataset.frame=String(fi);root.dataset.scene=progress<.39?'telescope':progress<.56?'ocean':progress<.80?'scatter':'about';progressDirty=false;
  }
  function makeFrame(index){
    if(cache.has(index))return cache.get(index);
    const frame=data[index],rows=frame.rows.split('\n');
    const image=document.createElement('canvas');image.width=1056;image.height=484;
    const c=image.getContext('2d');c.font='6.6666667px "Courier New",monospace';c.textBaseline='top';
    let k=0;image.glyphRows=[];
    rows.forEach((row,r)=>{
      const lines=['','','',''];
      for(let col=0;col<row.length;col++){
        const ch=row[col],tone=ch===' '?-1:Number(frame.ink[k++]);
        for(let n=0;n<4;n++)lines[n]+=n===tone?ch:' ';
      }
      image.glyphRows.push(lines);
      for(let n=0;n<4;n++)if(lines[n].trim()){c.fillStyle=palette[n];c.globalAlpha=inkAlpha[n];c.fillText(lines[n],0,(r-63)*4*(220/115)+242)}
    });
    if(cache.size>=5)cache.delete(cache.keys().next().value);
    cache.set(index,image);return image;
  }
  function prepareTimeline(){
    if(timeline||!window.gsap)return;
    timeline=gsap.timeline({paused:true}).to(pose,{turn:1,duration:.40,ease:'none'},0)
      .to(pose,{zoom:1,duration:.28,ease:'power2.in'},.40)
      .to(pose,{approach:1,duration:.30,ease:'power1.inOut'},.70);
  }
  const clouds=[{x:.08,y:.20,w:.22,h:.023},{x:.57,y:.12,w:.18,h:.018},{x:.82,y:.29,w:.15,h:.019}];
  function drawClouds(t){
    const glyphs=' .,:;~';
    for(let ci=0;ci<clouds.length;ci++){
      const cloud=clouds[ci],cx=((cloud.x+t*.006*(ci%2?-.6:1)+1.5)%1.5-.25)*1000;
      const cy=cloud.y*625,ww=cloud.w*1000,hh=cloud.h*625;
      oc.font='7px "Courier New",monospace';oc.fillStyle='#9ca7af';oc.globalAlpha=.44;
      for(let row=-2;row<=2;row++){
        let line='';const count=Math.round(ww/4.2);
        for(let col=0;col<count;col++){
          const u=(col/count-.5)*2,ell=u*u+(row/2.8)**2;
          const n=Math.sin(col*4.317+row*9.1+ci)*.5+.5;
          line+=ell<.92&&n>.68?glyphs[2+Math.floor(n*3)%4]:' ';
        }
        oc.fillText(line,cx-ww/2+Math.sin(row+ci)*10,cy+row*hh/2);
      }
    }
    oc.globalAlpha=1;
  }
  function drawIsland(t,approach,horizon){
    const width=285,height=76;
    const x=560+(pointerX-.5)*-15,base=horizon;
    const silhouette=[[0,.98],[.09,.91],[.17,.73],[.25,.57],[.32,.50],[.40,.28],[.47,.22],[.55,.31],[.62,.46],[.69,.42],[.77,.65],[.85,.78],[.94,.91],[1,.98],[1,1],[0,1]];
    oc.save();oc.translate(x-width/2,base-height);
    oc.beginPath();silhouette.forEach(([u,v],i)=>i?oc.lineTo(u*width,v*height):oc.moveTo(u*width,v*height));oc.closePath();oc.clip();
    const font=6.8,line=font*1.12,cell=font*.6;
    oc.font=`${font}px "Courier New",monospace`;oc.textBaseline='top';
    const glyphs='.,:;irsxX25hGM#@';
    for(let row=0;row<Math.ceil(height/line)+1;row++){
      oc.fillStyle='#F6D081';
      let text='';for(let col=0;col<Math.ceil(width/cell)+1;col++){const grain=Math.abs(Math.sin(col*6.17+row*13.71)*.5+.5);const index=Math.min(glyphs.length-1,Math.floor((grain*.45+(row/(height/line))*.55)*(glyphs.length-1)));text+=glyphs[(index+Math.floor(t*.7))%glyphs.length]}
      oc.fillText(text,0,row*line);
    }
    oc.restore();
    return {width,height};
  }
  function drawOcean(t,approach){
    const W=1000,H=625,horizon=276;
    oc.globalAlpha=1;oc.fillStyle='#f8fafb';oc.fillRect(0,0,W,H);
    drawClouds(t);
    const wash=oc.createLinearGradient(0,horizon,0,H);wash.addColorStop(0,'#f1f9fc');wash.addColorStop(.5,'#34B8C520');wash.addColorStop(1,'#1888BF38');
    oc.fillStyle=wash;oc.fillRect(0,horizon,W,H-horizon);
    const colors=['#1888BF','#1888BF','#34B8C5','#ffffff'];
    const glyphs='.,:;~=-i1tfLCG08@';
    const count=48;
    for(let row=0;row<count;row++){
      const v=row/(count-1),y=horizon+Math.pow(v,1.58)*(H-horizon);
      const cell=3.0+v*2.5,cols=Math.ceil(W/cell),lines=['','','',''];
      const depthPhase=22*Math.pow(v,.69)-t*(.72+v*.65);
      for(let col=0;col<cols;col++){
        const x=col/cols;
        const a=Math.sin(depthPhase+x*12+Math.sin(x*8+t*.22)*1.4);
        const b=Math.sin(depthPhase*2.17-x*21+t*.30);
        const c=Math.sin(x*94+row*1.8-t*.8);
        const value=.65*a+.28*b+.07*c;
        const cap=Math.abs(Math.sin(depthPhase+x*9+Math.sin(x*19+t*.18)*.32));
        const foam=cap<.10+v*.045 && Math.sin(x*73+row*.77+t*.25)>-.3;
        const tone=foam?3:value>.43?0:value>-.35?1:2;
        const grain=(Math.sin(col*12.9898+row*78.233)*43758.5453)%1;
        const gi=Math.max(0,Math.min(glyphs.length-1,Math.floor(((value+1)*.5+grain*.10)*(glyphs.length-1))));
        const ch=foam?'~=-'[Math.abs(col+row)%3]:glyphs[gi];
        for(let n=0;n<4;n++)lines[n]+=n===tone?ch:' ';
      }
      oc.font=`${cell/.6}px "Courier New",monospace`;oc.textBaseline='top';
      for(let n=0;n<4;n++){
        oc.fillStyle=colors[n];
        for(let start=0;start<cols;start+=24){
          const chunk=lines[n].slice(start,start+24);if(!chunk.trim())continue;
          const drift=Math.sin(start/cols*11+depthPhase*.35+t*.24)*(v*2.5);
          oc.fillText(chunk,start*cell+Math.sin(row*.8+t*.15)*2,y+drift);
        }
      }
    }
    drawIsland(t,approach,horizon);
    // Low-density mist at the horizon is also made of characters.
    oc.font='5px "Courier New",monospace';oc.fillStyle='#1888BF';oc.globalAlpha=.32;
    oc.fillText('.  . .    . : .  .     .  . '.repeat(18),0,horizon-2);oc.globalAlpha=1;
  }
  function draw(){
    prepareTimeline();const progress=state.p,p=clamp(progress/.56);
    if(progress>.56){
      heading.style.opacity='0';
      if(progress<.80)drawScatter((progress-.56)/.24);else drawAbout();
      drawAboutCopy(progress);updateProgress(progress,data.length-1);return;
    }
    debris=null;frozenOcean=null;about.style.opacity='0';about.setAttribute('aria-hidden','true');
    if(timeline)timeline.progress(p);else{pose.turn=clamp(p/.4);pose.zoom=Math.pow(clamp((p-.4)/.28),3);pose.approach=smooth((p-.7)/.3)}
    const w=canvas.width,h=canvas.height,cx=w/2,cy=h*.55,zoom=1+pose.zoom*13;
    ctx.globalAlpha=1;ctx.fillStyle='#f8fafb';ctx.fillRect(0,0,w,h);
    if(p>.4){
      drawOcean(reduced.matches?0:time,pose.approach);
      const aperture=w*.061*zoom;
      ctx.save();ctx.beginPath();ctx.arc(cx,cy,aperture,0,Math.PI*2);ctx.clip();
      const driftX=(pointerX-.5)*pose.approach*w*.016,driftY=(pointerY-.5)*pose.approach*h*.01;
      ctx.drawImage(ocean,driftX-w*.015,driftY-h*.015,w*1.03,h*1.03);
      // A very light glass vignette disappears as the viewing circle fills the screen.
      const rim=ctx.createRadialGradient(cx,cy,aperture*.72,cx,cy,aperture);rim.addColorStop(0,'#143e5b00');rim.addColorStop(1,'#143e5b24');ctx.fillStyle=rim;ctx.fillRect(0,0,w,h);ctx.restore();
    }
    const alpha=1-smooth((p-.60)/.11);
    const fi=Math.round(pose.turn*(data.length-1));
    if(alpha>.001){
      const image=makeFrame(fi);ctx.save();ctx.translate(cx,cy);ctx.scale(zoom,zoom);ctx.globalAlpha=alpha;
      if(pose.zoom>0){
        // The even-odd clip opens the glass without removing the navy rim.
        ctx.beginPath();ctx.rect(-w,-h,w*2,h*2);ctx.arc(0,0,w*.058,0,Math.PI*2);ctx.clip('evenodd');
      }
      const iw=w,ih=w*(484/1056);
      if(zoom<1.5)ctx.drawImage(image,-iw/2,-ih/2,iw,ih);
      else{
        ctx.scale(w/1056,w/1056);ctx.translate(-528,-242);ctx.font='6.6666667px "Courier New",monospace';ctx.textBaseline='top';
        image.glyphRows.forEach((lines,r)=>{const y=(r-63)*4*(220/115)+242;if(Math.abs(y-242)*zoom*w/1056>h)return;for(let n=0;n<4;n++)if(lines[n].trim()){ctx.fillStyle=palette[n];ctx.globalAlpha=alpha*inkAlpha[n];ctx.fillText(lines[n],0,y)}});
      }
      ctx.restore();
    }
    heading.style.opacity=String(1-smooth((p-.10)/.25));drawIntro();
    updateProgress(progress,fi);
  }
  function save(){
    window.openai?.setWidgetState?.({modelContent:{title:'Sailing Log',subtitle:"Hi, this is L's site",object:'单筒望远镜',palette:{telescope:'#184D97',ocean:['#1888BF','#34B8C5'],island:'#F6D081',about:'#184D97'},scene:'随机字符小岛；字符碎散到白色介绍页；左侧介绍、右侧用户提供的路飞人物草帽衣服及台词框字符画',motion:'滚轮推进和回退，海浪及人物字符持续流动，介绍逐行显现'},privateContent:{progress:target,revision:'sailing-v4'}})?.catch(()=>{});
  }
  function setProgress(p){
    target=clamp(p);clearTimeout(saveTimer);saveTimer=setTimeout(save,500);progressDirty=true;requestLoop();
  }
  function loop(now){
    raf=0;if(!root.isConnected||!visible)return;
    if(now-lastPaint<32){raf=requestAnimationFrame(loop);return}
    const dt=lastTime?Math.min(.08,(now-lastTime)/1000):.033;lastTime=now;lastPaint=now;
    if(reduced.matches)state.p=target;
    else if(Math.abs(state.p-target)>.00015){state.p+=(target-state.p)*(1-Math.exp(-dt*13));progressDirty=true}
    else if(state.p!==target){state.p=target;progressDirty=true}
    if(!reduced.matches){time+=dt;introTime+=dt}
    if(state.p>.79&&!reduced.matches)aboutTime+=dt;else if(state.p<.73)aboutTime=0;
    draw();
    if((!reduced.matches&&(state.p>.22||introTime<introDuration+.08))||Math.abs(state.p-target)>.00015)raf=requestAnimationFrame(loop);
  }
  function requestLoop(){if(!raf&&visible)raf=requestAnimationFrame(loop)}
  slider.addEventListener('input',()=>setProgress(Number(slider.value)/1000));
  stage.addEventListener('wheel',e=>{
    const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?400:1);
    if(target<=0&&delta<0||target>=1&&delta>0)return;
    e.preventDefault();setProgress(target+delta/4700);
  },{passive:false});
  stage.addEventListener('pointermove',e=>{if(reduced.matches)return;const rect=stage.getBoundingClientRect();pointerX=clamp((e.clientX-rect.left)/rect.width);pointerY=clamp((e.clientY-rect.top)/rect.height);requestLoop()});
  function resize(){const width=Math.max(320,stage.clientWidth);canvas.width=Math.min(1400,Math.round(width*Math.min(devicePixelRatio,1.5)));canvas.height=Math.round(canvas.width*(width<450?.83:.625));progressDirty=true;draw();requestLoop()}
  const saved=window.openai?.widgetState?.privateContent;if(saved?.revision==='sailing-v4'&&typeof saved.progress==='number')state.p=target=clamp(saved.progress);
  window.addEventListener('openai:set_globals',()=>{const saved=window.openai?.widgetState?.privateContent;const p=saved?.progress;if(saved?.revision==='sailing-v4'&&typeof p==='number'&&Math.abs(p-target)>.001){state.p=target=clamp(p);progressDirty=true;draw();requestLoop()}});
  new ResizeObserver(resize).observe(stage);
  new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(visible){lastTime=0;requestLoop()}else{cancelAnimationFrame(raf);raf=0}},{threshold:.01}).observe(stage);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else requestLoop()});
  reduced.addEventListener('change',()=>{progressDirty=true;draw();requestLoop()});resize();
})();
